# exynos-woa D10 V5: decode H.264 on the Exynos 9820 MFC (h264_exynos wrapper, tools/mfc/ffmpeg)
hwdec=exynosmfc-copy
vo=gpu
gpu-api=d3d11
# Interim until the WDDM2 Mali driver (notes/goal-bbb-bt-wifi.md): on the current Mali UMD mpv's window renders black;
# Microsoft WARP (CPU) draws it correctly, decode stays on the MFC. WARP needs the cheap scalers: default profile =
# ~1 fps, profile=fast = 31.6 fps untimed for BBB 1080p (bench 2026-10-15).
d3d11-warp=yes
profile=fast
