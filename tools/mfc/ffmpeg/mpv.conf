# exynos-woa D10 V5 / G17: decode H.264 on the Exynos 9820 MFC (h264_exynos wrapper, tools/mfc/ffmpeg) and render on
# the Mali (WDDM 2.0 driver, D3D11 FL 10_1). The interim Microsoft WARP renderer (d3d11-warp=yes) is gone: mpv's
# window rendered black on the Mali because flip-model presents were drawn with GDI and never reached the runtime -
# fixed in Mesa 0094 (2026-10-17, notes/g17-dxva-mfc.md).
hwdec=exynosmfc-copy
vo=gpu
gpu-api=d3d11
